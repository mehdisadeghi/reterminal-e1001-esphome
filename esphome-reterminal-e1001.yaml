# =============================================================================
# reTerminal E1001 — ePaper dashboard
# Pages: world clock / indoor+outdoor climate / 24 h temperature and
# humidity graphs (history fetched from Home Assistant's REST API).
# =============================================================================
#
# Hardware list / 硬件清单:
#   1. 7.5" B/W ePaper display (800x480, SPI)     / 7.5 英寸黑白墨水屏
#   2. 3x buttons (GPIO3, GPIO4, GPIO5)            / 3 个按钮
#   3. Buzzer (GPIO45, PWM)                         / 蜂鸣器
#   4. Onboard LED (GPIO6)                          / 板载 LED
#   5. Battery voltage (GPIO1 ADC + GPIO21 EN)      / 电池电压监测
#   6. SHT4x temp & humidity sensor (I2C)           / SHT4x 温湿度传感器
#   7. PCF8563 RTC (I2C addr 0x51, CR1220 backup)   / PCF8563 实时时钟
#   8. PDM Microphone (CLK=42, DATA=41, EN=38)      / PDM 麦克风
#   9. MicroSD card slot (SPI + DET=15, EN=16)      / MicroSD 卡槽
#  10. Deep sleep with button wake-up                / 深度睡眠 + 按钮唤醒
#
# Buttons: green = fetch history + redraw, right white = next page,
#          left white = previous page. Any button wakes from deep sleep.
#
# Serial debug: UART0 via CH340K USB bridge
# =============================================================================
substitutions:
  device_name: reterminal-e1001
  friendly_name: "reTerminal_E1001"
  ha_http_ip: !secret ha_http_ip
  ha_api_token: !secret ha_api_token

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - reterminal_epaper.h
  # Arduino libs for the HA history fetch; ESPHome builds with the library
  # dependency finder off, so they must be listed explicitly
  libraries:
    - WiFi
    - WiFiClientSecure
    - HTTPClient
  on_boot:
    # -100 = everything is set up, so boot_flow may draw immediately
    priority: -100
    then:
      # Power rails / 打开供电
      - output.turn_on: bsp_sd_enable
      - output.turn_on: bsp_battery_enable
      - output.turn_on: mic_power_enable
      - delay: 200ms
      - component.update: battery_voltage
      - component.update: battery_level
      # Read RTC time before anything needs the clock / 启动时读取 RTC 时间
      - pcf8563.read_time:
      - script.execute: boot_flow

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable serial logging / 启用串口日志
# The reTerminal E series has a CH340K USB-to-UART bridge on UART0.
# Default ESP32-S3 logger uses USB_CDC — won't produce output on the physical port.
# reTerminal E 系列板载 CH340K 桥接芯片，串口走 UART0，非默认的 USB_CDC。
logger:
  hardware_uart: UART0

# =============================================================================
# Fonts / 字体
# =============================================================================

# Explicit glyph set: the default covers ASCII only, we need the degree sign
font:
  - file: "gfonts://Inter@700"
    id: font_small
    size: 20
    glyphs: &glyphs '!"%()+,-./0123456789:;=?ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz °'
  - file: "gfonts://Inter@700"
    id: font_medium
    size: 32
    glyphs: *glyphs
  - file: "gfonts://Inter@700"
    id: font_large
    size: 48
    glyphs: *glyphs
  - file: "gfonts://Inter@700"
    id: font_huge
    size: 72
    glyphs: *glyphs

# SPI — shared by ePaper display and SD card
# SPI — 墨水屏和 SD 卡共用
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9
  # MISO is needed for SD card reading (ePaper is write-only)
  # MISO 用于 SD 卡读取（墨水屏只写不读）
  miso_pin: GPIO8

# I2C — shared by SHT4x sensor, PCF8563 RTC
# I2C — SHT4x 传感器和 PCF8563 实时时钟共用
i2c:
  scl: GPIO20
  sda: GPIO19

# I2S audio bus — for the onboard PDM microphone
# I2S 音频总线 — 用于板载 PDM 麦克风
i2s_audio:
  i2s_lrclk_pin: GPIO42

output:
  # [4] Onboard LED (active low) / 板载 LED（低电平有效）
  - platform: gpio
    pin: GPIO6
    id: bsp_led
    inverted: true

  # [9] SD card power enable / SD 卡供电使能
  - platform: gpio
    pin: GPIO16
    id: bsp_sd_enable

  # [5] Battery measurement enable / 电池测量使能
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

  # [3] Buzzer PWM output / 蜂鸣器 PWM 输出
  - platform: ledc
    pin: GPIO45
    id: buzzer_pwm
    frequency: 1000Hz

  # [8] Microphone power enable (TPS22916 load switch)
  # 麦克风供电使能（TPS22916 负载开关）
  - platform: gpio
    pin: GPIO38
    id: mic_power_enable

script:
  - id: beep_short
    mode: restart
    then:
      - light.turn_on:
          id: buzzer
          brightness: 50%
      - delay: 80ms
      - light.turn_off: buzzer

  - id: page_prev
    mode: single
    then:
      - script.execute: beep_short
      - lambda: 'reterminal::prev_page();'
      - component.update: epaper_display

  - id: page_next
    mode: single
    then:
      - script.execute: beep_short
      - lambda: 'reterminal::next_page();'
      - component.update: epaper_display

  - id: do_fetch
    mode: single
    then:
      - script.execute: beep_short
      - if:
          condition:
            wifi.connected:
          then:
            - lambda: 'reterminal::fetch_history("http://${ha_http_ip}:8123", "${ha_api_token}");'
      - component.update: epaper_display

  # Runs once per wake. Button wakes flip the page instantly with the values
  # cached in RTC memory; timer/green wakes wait for HA, fetch history when
  # due, then redraw once.
  - id: boot_flow
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              auto a = reterminal::wake_action();
              return a == reterminal::WAKE_PREV || a == reterminal::WAKE_NEXT;
          then:
            - script.execute: beep_short
            - lambda: |-
                if (reterminal::wake_action() == reterminal::WAKE_PREV)
                  reterminal::prev_page();
                else
                  reterminal::next_page();
            - component.update: epaper_display
          else:
            - if:
                condition:
                  lambda: 'return reterminal::wake_action() == reterminal::WAKE_FETCH;'
                then:
                  - script.execute: beep_short
            - wait_until:
                condition:
                  api.connected:
                timeout: 20s
            # Give HA a moment to push sensor states after connecting
            - delay: 3s
            - if:
                condition:
                  lambda: |-
                    return reterminal::fetch_due() ||
                           reterminal::wake_action() == reterminal::WAKE_FETCH;
                then:
                  - lambda: 'reterminal::fetch_history("http://${ha_http_ip}:8123", "${ha_api_token}");'
            - component.update: epaper_display

sensor:
  # --- SHT4x temperature & humidity (I2C) ---
  - platform: sht4x
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Relative Humidity"
      id: hum_sensor
    update_interval: 60s

  # --- Battery voltage (ADC on GPIO1) ---
  - platform: adc
    pin: GPIO1
    name: "Battery Voltage"
    id: battery_voltage
    update_interval: 60s
    attenuation: 12db
    filters:
      # Compensate for onboard voltage divider (1:2)
      # 补偿板载分压电阻（1:2 比例）
      - multiply: 2.0

  # --- Battery level (percentage) ---
  - platform: template
    name: "Battery Level"
    id: battery_level
    unit_of_measurement: "%"
    icon: "mdi:battery"
    device_class: battery
    state_class: measurement
    lambda: 'return id(battery_voltage).state;'
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.96 -> 90.0
          - 3.91 -> 80.0
          - 3.85 -> 70.0
          - 3.80 -> 60.0
          - 3.75 -> 50.0
          - 3.68 -> 40.0
          - 3.58 -> 30.0
          - 3.49 -> 20.0
          - 3.41 -> 10.0
          - 3.30 -> 5.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

  # --- Indoor / outdoor climate from HA ---
  # Last values are cached in RTC memory so button wakes can redraw
  # instantly, before the API reconnects.
  - platform: homeassistant
    id: in_temp
    entity_id: sensor.indoor_temperature
    on_value:
      then:
        - lambda: |-
            reterminal::last_val[reterminal::S_IN_T] = x;
            reterminal::last_val_time = ::time(nullptr);

  - platform: homeassistant
    id: out_temp
    entity_id: sensor.outdoor_temperature
    on_value:
      then:
        - lambda: |-
            reterminal::last_val[reterminal::S_OUT_T] = x;
            reterminal::last_val_time = ::time(nullptr);

  - platform: homeassistant
    id: in_hum
    entity_id: sensor.indoor_humidity
    on_value:
      then:
        - lambda: |-
            reterminal::last_val[reterminal::S_IN_H] = x;
            reterminal::last_val_time = ::time(nullptr);

  - platform: homeassistant
    id: out_hum
    entity_id: sensor.outdoor_humidity
    on_value:
      then:
        - lambda: |-
            reterminal::last_val[reterminal::S_OUT_H] = x;
            reterminal::last_val_time = ::time(nullptr);

binary_sensor:
  # The millis() gate skips the phantom on_press fired while booting from a
  # button wake — boot_flow already handles that press.

  # Button 1 (green) — force history fetch + redraw
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: button_1
    name: "Button 1 (Green)"
    on_press:
      then:
        - if:
            condition:
              lambda: 'return millis() > 2000;'
            then:
              - script.execute: do_fetch

  # Button 2 (right white) — next page
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: button_2
    name: "Button 2 (Right White)"
    on_press:
      then:
        - if:
            condition:
              lambda: 'return millis() > 2000;'
            then:
              - script.execute: page_next

  # Button 3 (left white) — previous page
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: button_3
    name: "Button 3 (Left White)"
    on_press:
      then:
        - if:
            condition:
              lambda: 'return millis() > 2000;'
            then:
              - script.execute: page_prev

  # [9] SD card detect (LOW = card present)
  # SD 卡检测（低电平 = 卡已插入）
  - platform: gpio
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    id: sd_card_detect
    name: "SD Card Detected"

light:
  - platform: binary
    name: "Onboard LED"
    output: bsp_led
    id: onboard_led

  # Buzzer wrapped as a "light": brightness = volume
  # 蜂鸣器包装成"灯"实体：亮度 = 音量
  - platform: monochromatic
    output: buzzer_pwm
    name: "Buzzer"
    id: buzzer
    default_transition_length: 0s

time:
  # PCF8563 is at I2C address 0x51 with a CR1220 coin cell backup.
  # On boot we read the RTC; when HA syncs, we write back to the RTC.
  # PCF8563 在 I2C 地址 0x51，由 CR1220 纽扣电池备份。
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    update_interval: never

  - platform: homeassistant
    on_time_sync:
      then:
        - pcf8563.write_time:

# Home Assistant native API / Home Assistant 原生 API
api:
  encryption:
    key: !secret api_encryption_key

# OTA (Over-The-Air) firmware update / 空中固件更新
ota:
  - platform: esphome
    password: !secret ota_password

# Wi-Fi settings / Wi-Fi 设置
wifi:
  ssid: "your-ssid"
  password: !secret wifi_password
  ap:
    ssid: "reTerminal-E1001"
    password: "ChangeMe123"

captive_portal:

# =============================================================================
# [8] PDM Microphone / PDM 麦克风
# =============================================================================

microphone:
  - platform: i2s_audio
    id: onboard_mic
    adc_type: external
    pdm: true
    i2s_din_pin: GPIO41

# =============================================================================
# [1] ePaper display (7.5" B/W, 800x480)
# 墨水屏（7.5 英寸黑白，800×480）
# =============================================================================

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    # Redraws are triggered explicitly: once per wake and on page changes
    update_interval: never
    lambda: |-
      switch (reterminal::page) {
        case 0:
          reterminal::draw_world_clock(it, id(font_large), id(font_medium), id(font_small));
          break;
        case 1:
          reterminal::draw_numbers(it, id(font_huge), id(font_large), id(font_medium),
                                   id(font_small), id(battery_level).state);
          break;
        case 2:
          reterminal::draw_graph_page(it, reterminal::S_IN_T, reterminal::S_OUT_T,
                                      "Temperature - 24h", "°C", id(font_medium), id(font_small));
          break;
        case 3:
          reterminal::draw_graph_page(it, reterminal::S_IN_H, reterminal::S_OUT_H,
                                      "Humidity - 24h", "%", id(font_medium), id(font_small));
          break;
      }

# =============================================================================
# [10] Deep sleep / 深度睡眠
# Wakes every 5 min to refresh; any button wakes it immediately.
# =============================================================================

deep_sleep:
  id: deep_sleep_1
  # Room for wifi + API connect + a history fetch + one e-paper refresh
  run_duration: 45s
  sleep_duration: 5min
  esp32_ext1_wakeup:
    mode: ANY_LOW
    pins:
      - number: GPIO3
        mode: INPUT_PULLUP
        allow_other_uses: true
      - number: GPIO4
        mode: INPUT_PULLUP
        allow_other_uses: true
      - number: GPIO5
        mode: INPUT_PULLUP
        allow_other_uses: true

# secrets.yaml (create this file alongside your config):
# wifi_password: "Your WiFi Password"
# ota_password: "choose-a-strong-password"
# api_encryption_key: "generate with: openssl rand -base64 32"
# ha_http_ip: "192.168.x.x"           # HA LAN IP (firewall pinhole target)
# ha_api_token: "long-lived access token of a non-admin HA user"
