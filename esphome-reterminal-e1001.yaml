substitutions:
  # every unit runs this build and appends its MAC to the name
  # (reterminal-e1001-a1b2c3), which also names its HA helpers; adopting
  # a unit in the ESPHome Builder pins that name in a copy of this file
  device_name: reterminal-e1001
  friendly_name: "reTerminal E1001"
  # fallback hotspot name, shared: only an unprovisioned unit opens it
  ap_ssid: ${device_name}
  ha_http_ip: !secret ha_http_ip
  ha_api_token: !secret ha_api_token
  # where a build fetches the component and fonts from, and where adoption
  # points; a fork changes source_repo. Local builds override the two
  # derived paths (see the Makefile).
  source_repo: mehdisadeghi/reterminal-e1001-esphome
  source_ref: main
  component_source: github://${source_repo}@${source_ref}
  font_dir: https://raw.githubusercontent.com/${source_repo}/${source_ref}/reterminal-e1001

packages:
  core: !include reterminal-e1001/packages/core.yaml
  hardware: !include reterminal-e1001/packages/hardware.yaml
  network: !include reterminal-e1001/packages/network.yaml
  controls: !include reterminal-e1001/packages/controls.yaml
  fonts: !include reterminal-e1001/packages/fonts.yaml
  app: !include reterminal-e1001/packages/app.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "Seeed Studio.reTerminal E1001"
    # placeholder: the reterminal component stamps git describe of its own
    # source, which a remote build has and this file does not
    version: "unstamped"

# Makes a running unit adoptable in the ESPHome Builder, which writes a
# config for it that pulls this file as a remote package
dashboard_import:
  package_import_url: github://${source_repo}/esphome-reterminal-e1001.yaml@${source_ref}
