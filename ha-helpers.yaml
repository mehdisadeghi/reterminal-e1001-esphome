# reTerminal — HA-side queued controls, one set per unit.
#
# These are Home Assistant helpers, not device entities: HA holds their
# state and pushes it to the unit on its next sync, so they work while it
# sleeps (native device entities cannot — commanding them while asleep
# yields "Authenticated connection not ready yet").
#
# A template: @UNIT@ stands for the unit's name with underscores, e.g.
# reterminal_e1001_a1b2c3 for the unit that shows reterminal-e1001-a1b2c3
# on its setup screen and debug page. `make helpers UNIT=<name>` fills it
# in and installs it as <ha config>/packages/<unit>.yaml — NOT into
# /config/esphome/. Once per HA, configuration.yaml must contain:
#
#   homeassistant:
#     packages: !include_dir_named packages
#
# then restart HA (`ha core restart`). The entities appear under
# Settings -> Devices & services -> Helpers and in Developer Tools ->
# States; they cannot be linked to the reTerminal device in HA's registry,
# so add them to a dashboard card next to the device's controls.

input_button:
  @UNIT@_press:
    name: @UNIT@ Press
    icon: mdi:bell-ring
    # One beep on the next wake ("awake now"); presses collapse into one.

input_boolean:
  @UNIT@_keep_awake:
    name: @UNIT@ Keep Awake (queued)
    icon: mdi:sleep-off
    # While on, the device stays awake from its next sync onward (it beeps
    # once on receipt). Turn off to let it sleep again.

input_text:
  @UNIT@_config:
    name: @UNIT@ Config Queue
    icon: mdi:tune
    max: 255
    # Semicolon-separated changes, applied on the next sync and then
    # cleared by the device as the acknowledgement, e.g.:
    #   zone3=Asia/Dubai;show7=off;night=19-7;col1=Device=dev
