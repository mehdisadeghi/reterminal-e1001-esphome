# reTerminal E1001 — app package (merged by packages: in the main yaml)

# =============================================================================
# Fonts / 字体
# =============================================================================

# UI fonts come from packages/fonts-en.yaml or fonts-fa.yaml (language
# choice of the device yaml); the Persian corpus fonts below are shared.
font:
  # Presentation forms of نقطه; printed in visual (RTL-reversed) order,
  # so no text shaping is needed
  - file: "reterminal-e1001/noqte.ttf"
    id: font_noqte
    size: 260
    glyphs: "ﻧﻘﻄﻪ"
  # Persian, pre-shaped at build time (gen_fa_assets.py); the glyph lists
  # are generated to exactly cover the corpus and title
  - file: "reterminal-e1001/vazirmatn.ttf"
    id: font_fa_body
    size: 40
    glyphs: !include ../fa_glyphs.yaml
  - file: "reterminal-e1001/noqte.ttf"
    id: font_fa_title
    size: 64
    glyphs: !include ../fa_title_glyphs.yaml

interval:
  # Enter sleep a short grace after the last activity, once no command
  # script is mid-flight. Keeping the device up is the HA-queued
  # input_boolean.${helper_prefix}_keep_awake, delivered on wake like "Press".
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - switch.is_off: sleep_pause
              - binary_sensor.is_off: keep_awake
              # an unprovisioned device must stay awake, or its hotspot and
              # Improv would vanish before credentials can be entered
              - lambda: 'return esphome::wifi::global_wifi_component->has_sta();'
              - lambda: 'return reterminal::sleep_due();'
              - not:
                  script.is_running: boot_flow
              - not:
                  script.is_running: do_fetch
              - not:
                  script.is_running: page_next
              - not:
                  script.is_running: page_prev
              - not:
                  script.is_running: net_refresh
              - not:
                  script.is_running: apply_changes
              - not:
                  script.is_running: sd_check
          then:
            # Persist history to the flash partition (hourly) before sleeping
            - lambda: 'reterminal::maybe_snapshot();'
            - deep_sleep.enter:
                id: deep_sleep_1
                sleep_duration: !lambda 'return (uint32_t) reterminal::refresh_interval_min * 60000;'
      # Held awake past the refresh interval: redraw so the clocks stay
      # current (never reached in normal wake-sleep cycles)
      - if:
          condition:
            lambda: 'return reterminal::redraw_due();'
          then:
            - component.update: epaper_display

script:
  - id: zones_changed
    mode: restart
    then:
      - lambda: |-
          reterminal::rebuild_zones(
              id(zone1_en).state ? id(zone_1).state.c_str() : "",
              id(zone2_en).state ? id(zone_2).state.c_str() : "",
              id(zone3_en).state ? id(zone_3).state.c_str() : "",
              id(zone4_en).state ? id(zone_4).state.c_str() : "",
              id(zone5_en).state ? id(zone_5).state.c_str() : "",
              id(home_zone_t).state.c_str());
          reterminal::bump_interact();

  - id: cols_changed
    mode: restart
    then:
      - lambda: |-
          reterminal::rebuild_columns(id(col_1).state.c_str(), id(col_2).state.c_str(),
                                      id(col_3).state.c_str());
          reterminal::bump_interact();

  # Shared apply path for config change-sets (HA config queue and SD card):
  # semicolon-separated key=value pairs from reterminal::pending_changes.
  - id: apply_changes
    mode: queued
    then:
      - lambda: |-
          std::string s = reterminal::pending_changes;
          reterminal::pending_changes.clear();
          size_t pos = 0;
          while (pos <= s.size()) {
            size_t end = s.find(';', pos);
            if (end == std::string::npos) end = s.size();
            std::string kv = s.substr(pos, end - pos);
            pos = end + 1;
            size_t eq = kv.find('=');
            if (eq == std::string::npos) {
              if (!kv.empty())
                ESP_LOGW("reterminal", "apply: bad entry '%s'", kv.c_str());
              if (end == s.size()) break;
              continue;
            }
            std::string k = kv.substr(0, eq), v = kv.substr(eq + 1);
            esphome::text::Text *zones_t[5] = {id(zone_1), id(zone_2), id(zone_3),
                                               id(zone_4), id(zone_5)};
            esphome::switch_::Switch *shows[7] = {id(show_page1), id(show_page2),
                                                  id(show_page3), id(show_page4),
                                                  id(show_page5), id(show_page6),
                                                  id(show_page7)};
            esphome::text::Text *cols_t[3] = {id(col_1), id(col_2), id(col_3)};
            if (k.size() == 5 && k.rfind("zone", 0) == 0 && k[4] >= '1' && k[4] <= '5') {
              zones_t[k[4] - '1']->make_call().set_value(v).perform();
            } else if (k.size() == 4 && k.rfind("col", 0) == 0 && k[3] >= '1' && k[3] <= '3') {
              cols_t[k[3] - '1']->make_call().set_value(v).perform();
            } else if (k == "lang") {
              id(ui_lang).make_call().set_option(v).perform();
            } else if (k == "barskip") {
              id(bar_skip).make_call().set_value(v).perform();
            } else if (k == "sync") {
              id(sync_interval).make_call().set_value(atoi(v.c_str())).perform();
            } else if (k == "refresh") {
              id(refresh_interval).make_call().set_value(atoi(v.c_str())).perform();
            } else if (k == "home") {
              id(home_zone_t).make_call().set_value(v).perform();
            } else if (k == "days") {
              id(combo_days).make_call().set_value(atoi(v.c_str())).perform();
            } else if (k == "night") {
              int f, t;
              if (sscanf(v.c_str(), "%d-%d", &f, &t) == 2) {
                id(night_from_n).make_call().set_value(f).perform();
                id(night_to_n).make_call().set_value(t).perform();
              } else {
                ESP_LOGW("reterminal", "apply: bad night '%s'", v.c_str());
              }
            } else if (k == "start") {
              id(start_page).make_call().set_value(atoi(v.c_str())).perform();
            } else if (k.size() == 5 && k.rfind("show", 0) == 0 && k[4] >= '1' && k[4] <= '7') {
              if (v == "on") shows[k[4] - '1']->turn_on();
              else shows[k[4] - '1']->turn_off();
            } else if (k == "cycle") {
              if (v == "on") id(auto_cycle).turn_on();
              else id(auto_cycle).turn_off();
            } else {
              ESP_LOGW("reterminal", "apply: unknown key '%s'", k.c_str());
            }
            if (end == s.size()) break;
          }
          if (reterminal::page_hidden(reterminal::page))
            reterminal::next_page();
      - component.update: epaper_display
      - lambda: 'reterminal::bump_interact();'

  # Mount the SD card, load the tzdata override, and apply /config.json when
  # its content changed. Two short beeps = applied, one long = rejected.
  - id: sd_check
    mode: single
    then:
      - if:
          condition:
            binary_sensor.is_on: sd_card_detect
          then:
            # New firmware boots first; /config.json is then processed by
            # the next boot's sd_check, already on the new image
            - if:
                condition:
                  lambda: 'return reterminal::sd_flash_firmware();'
                then:
                  - script.execute: beep_ok
                  - delay: 1s
                  - lambda: 'App.safe_reboot();'
                else:
                  - lambda: |-
                      std::string ch = reterminal::sd_process();
                      if (!ch.empty())
                        reterminal::pending_changes = ch;
                  - if:
                      condition:
                        lambda: 'return reterminal::sd_time_was_set;'
                      then:
                        - pcf8563.write_time:
                        - lambda: 'reterminal::sd_time_was_set = false;'
                  - if:
                      condition:
                        lambda: 'return !reterminal::pending_changes.empty();'
                      then:
                        - script.execute: apply_changes
                        - script.execute: beep_ok
                  - if:
                      condition:
                        lambda: 'return reterminal::sd_error || reterminal::sd_fw_error;'
                      then:
                        - script.execute: beep_err

  - id: beep_ok
    mode: single
    then:
      - script.execute: beep_short
      - delay: 250ms
      - script.execute: beep_short

  - id: beep_err
    mode: single
    then:
      - light.turn_on:
          id: buzzer
          brightness: 50%
      - delay: 600ms
      - light.turn_off: buzzer

  - id: beep_short
    mode: restart
    then:
      - light.turn_on:
          id: buzzer
          brightness: 50%
      - delay: 80ms
      - light.turn_off: buzzer

  - id: page_prev
    mode: single
    then:
      - script.execute: beep_short
      - lambda: 'reterminal::prev_page();'
      - component.update: epaper_display
      - lambda: 'reterminal::bump_interact();'
      # A flip onto a data page with nothing to show yet earns a refresh
      - if:
          condition:
            lambda: 'return reterminal::page_data_empty(reterminal::page);'
          then:
            - script.execute: net_refresh

  - id: page_next
    mode: single
    then:
      - script.execute: beep_short
      - lambda: 'reterminal::next_page();'
      - component.update: epaper_display
      - lambda: 'reterminal::bump_interact();'
      # A flip onto a data page with nothing to show yet earns a refresh
      - if:
          condition:
            lambda: 'return reterminal::page_data_empty(reterminal::page);'
          then:
            - script.execute: net_refresh

  # Green button: sync + fetch now. Also the recovery path when the radio
  # switch is off — wifi is enabled for this wake, the switch untouched.
  - id: do_fetch
    mode: single
    then:
      - script.execute: beep_short
      # on the Khayyam page green means "another quatrain"
      - lambda: |-
          if (reterminal::page == 7)
            reterminal::khayyam_reroll();
      - if:
          condition:
            lambda: 'return !reterminal::radio_on;'
          then:
            - wifi.enable:
            - lambda: 'reterminal::radio_on = true;'
      - lambda: 'reterminal::force_sync = true;'
      - script.execute: net_refresh

  # Network part of a wake: HA sync (API: time + queued helpers) only when
  # due or forced; REST data work only when the shown page needs it. Ends
  # with the wake's single redraw.
  - id: net_refresh
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              return reterminal::radio_on &&
                     (reterminal::force_sync || reterminal::network_needed());
          then:
            # let a click beep finish first — the fetch lambdas block the
            # loop, which would hold the buzzer on for the whole fetch
            - script.wait: beep_short
            - wait_until:
                condition:
                  wifi.connected:
                timeout: 10s
            - if:
                condition:
                  lambda: 'return reterminal::force_sync || reterminal::sync_due();'
                then:
                  - wait_until:
                      condition:
                        api.connected:
                      timeout: 2s
                  # HA only sends time on request and the platform's 15 min
                  # polling never fires within a wake window
                  - lambda: 'id(ha_time).update();'
                  - wait_until:
                      condition:
                        time.has_time:
                      timeout: 10s
                  # Let HA push the queued helpers (Press, keep-awake, config)
                  - delay: 1s
                  - lambda: 'reterminal::sync_attempt_at = ::time(nullptr);'
            # green = full sync: live values and history refresh on any page
            - if:
                condition:
                  and:
                    - wifi.connected:
                    - lambda: |-
                        return reterminal::page_needs_live(reterminal::page) ||
                               (reterminal::force_sync && reterminal::any_ha_col());
                then:
                  - lambda: 'reterminal::poll_live(id(ha_url).state.c_str(), id(ha_token).state.c_str());'
            - if:
                condition:
                  and:
                    - wifi.connected:
                    - lambda: |-
                        return (reterminal::force_sync && reterminal::any_ha_col()) ||
                               (reterminal::page_needs_history(reterminal::page) &&
                                (reterminal::fetch_due() ||
                                 reterminal::page_data_empty(reterminal::page)));
                then:
                  - lambda: 'reterminal::fetch_history(id(ha_url).state.c_str(), id(ha_token).state.c_str());'
      - component.update: epaper_display
      # A green press earns a 30 s interaction window; other wakes get the
      # short grace
      - lambda: |-
          if (reterminal::force_sync)
            reterminal::bump_awake_for(reterminal::INTERACT_AWAKE_MS);
          else
            reterminal::bump_awake();
          reterminal::force_sync = false;

  # Runs once per wake. Button wakes flip the page instantly with the values
  # cached in RTC memory; timer/green wakes wait for HA, fetch history when
  # due, then redraw once.
  - id: boot_flow
    mode: single
    then:
      - if:
          condition:
            lambda: |-
              auto a = reterminal::wake_action();
              return a == reterminal::WAKE_PREV || a == reterminal::WAKE_NEXT;
          then:
            - script.execute: beep_short
            - lambda: |-
                if (reterminal::wake_action() == reterminal::WAKE_PREV)
                  reterminal::prev_page();
                else
                  reterminal::next_page();
            # The SHT4x's first measurement lands moments after boot; without
            # this wait the dev-column sample is NaN every wake
            - wait_until:
                condition:
                  lambda: 'return !std::isnan(id(temp_sensor).state);'
                timeout: 3s
            - lambda: 'reterminal::tick_data(id(temp_sensor).state, id(hum_sensor).state);'
            - component.update: epaper_display
            # A wake press is unambiguous interaction; it precedes the uptime
            # gate, so use the window directly
            - lambda: 'reterminal::bump_awake_for(reterminal::INTERACT_AWAKE_MS);'
            # A flip onto a data page with nothing to show yet earns a refresh
            - if:
                condition:
                  lambda: 'return reterminal::page_data_empty(reterminal::page);'
                then:
                  - script.execute: net_refresh
          else:
            - if:
                condition:
                  lambda: 'return reterminal::wake_action() == reterminal::WAKE_FETCH;'
                then:
                  - script.execute: beep_short
                  # Green also recovers from a disabled radio for one wake
                  - if:
                      condition:
                        lambda: 'return !reterminal::radio_on;'
                      then:
                        - wifi.enable:
                        - lambda: 'reterminal::radio_on = true;'
                  - lambda: |-
                      if (reterminal::page == 7)
                        reterminal::khayyam_reroll();
                      reterminal::force_sync = true;
            # Advance first so the network decision matches the page shown
            - if:
                condition:
                  and:
                    - switch.is_on: auto_cycle
                    - lambda: 'return reterminal::wake_action() == reterminal::WAKE_TIMER;'
                then:
                  - lambda: 'reterminal::next_page();'
            # Roll the history windows and sample dev columns (the SHT4x's
            # first measurement lands moments after boot, hence the wait)
            - wait_until:
                condition:
                  lambda: 'return !std::isnan(id(temp_sensor).state);'
                timeout: 3s
            - lambda: 'reterminal::tick_data(id(temp_sensor).state, id(hum_sensor).state);'
            - if:
                condition:
                  lambda: 'return reterminal::force_sync || reterminal::network_needed();'
                then:
                  - script.execute: net_refresh
                else:
                  - component.update: epaper_display
                  - lambda: 'reterminal::bump_awake();'
      # Reaching the end of a boot confirms a freshly flashed firmware
      - lambda: 'reterminal::rollback_confirm();'

binary_sensor:
  # HA-queued keep-awake: create a Toggle helper with entity id
  # input_boolean.${helper_prefix}_keep_awake. Its state is delivered as soon as
  # the device wakes; while on, the device does not go back to sleep.
  # Turn it off (device is awake and receives it immediately) to resume.
  - platform: homeassistant
    id: keep_awake
    entity_id: input_boolean.${helper_prefix}_keep_awake
    on_press:
      then:
        - script.execute: beep_short
    on_release:
      then:
        - lambda: 'reterminal::bump_interact();'

  # The millis() gate skips the phantom on_press fired while booting from a
  # button wake — boot_flow already handles that press.

  # Button 1 (green) — force history fetch + redraw
  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: button_1
    name: "Button 1 (Green)"
    entity_category: diagnostic
    on_press:
      then:
        - if:
            condition:
              lambda: 'return millis() > 2000;'
            then:
              - script.execute: do_fetch

  # Button 2 (right white) — next page
  - platform: gpio
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: button_2
    name: "Button 2 (Right White)"
    entity_category: diagnostic
    on_press:
      then:
        - if:
            condition:
              lambda: 'return millis() > 2000;'
            then:
              - script.execute: page_next

  # Button 3 (left white) — previous page
  - platform: gpio
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
      allow_other_uses: true
    id: button_3
    name: "Button 3 (Left White)"
    entity_category: diagnostic
    on_press:
      then:
        - if:
            condition:
              lambda: 'return millis() > 2000;'
            then:
              - script.execute: page_prev

  # [9] SD card detect (LOW = card present)
  # SD 卡检测（低电平 = 卡已插入）
  - platform: gpio
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    id: sd_card_detect
    name: "SD Card Detected"
    entity_category: diagnostic
    on_press:
      then:
        # Card inserted while awake: settle, then process it
        - if:
            condition:
              lambda: 'return millis() > 3000;'
            then:
              - delay: 500ms
              - lambda: 'reterminal::sd_mounted = false;'
              - script.execute: sd_check

# =============================================================================
# [1] ePaper display (7.5" B/W, 800x480)
# 墨水屏（7.5 英寸黑白，800×480）
# =============================================================================

display:
  - platform: waveshare_epaper
    id: epaper_display
    model: 7.50inv2
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin:
      number: GPIO12
      inverted: false
    busy_pin:
      number: GPIO13
      inverted: true
    # Redraws are triggered explicitly: once per wake and on page changes
    update_interval: never
    lambda: |-
      reterminal::mark_draw();
      // Unprovisioned: show the setup instructions instead of the pages —
      // phones often skip the captive-portal popup (private DNS, https-only
      // probes), so the URL must be discoverable on the device itself
      if (!esphome::wifi::global_wifi_component->has_sta()) {
        it.print(400, 140, reterminal::lfont(reterminal::F_LARGE), TextAlign::CENTER,
                 lang::L().wifi_title);
        it.print(400, 215, reterminal::lfont(reterminal::F_MEDIUM), TextAlign::CENTER,
                 lang::L().wifi_join);
        it.print(400, 265, reterminal::lfont(reterminal::F_MEDIUM), TextAlign::CENTER,
                 "${ap_ssid}");
        it.print(400, 330, reterminal::lfont(reterminal::F_SMALL), TextAlign::CENTER,
                 lang::L().open_url);
        return;
      }
      switch (reterminal::page) {
        case 0:
          reterminal::draw_analog_clocks(it, id(analog_offsets).state,
                                         id(analog_inside).state);
          break;
        case 1:
          reterminal::draw_world_clock(it);
          break;
        case 2:
          reterminal::draw_numbers(it);
          break;
        case 3:
          reterminal::draw_graph_page(it, reterminal::M_TEMP);
          break;
        case 4:
          reterminal::draw_graph_page(it, reterminal::M_HUM);
          break;
        case 5:
          reterminal::draw_week_page(it);
          break;
        case 6:
          it.print(400, 240, id(font_noqte), TextAlign::CENTER, "ﻪﻄﻘﻧ");
          break;
        case 7:
          reterminal::draw_khayyam(it, id(font_fa_title), id(font_fa_body));
          break;
      }
      if (reterminal::bar_on_[reterminal::page])
        reterminal::draw_status_bar(it, id(battery_level).state,
                                    id(temp_sensor).state, id(hum_sensor).state,
                                    id(bar_climate).state, id(sd_card_detect).state,
                                    id(bar_jalali).state, id(bar_hijri).state,
                                    id(sleep_pause).state || id(keep_awake).state);
      // optional hairline battery gauge: vertical on the right edge like a
      // standing battery — filled from the bottom up, inset 2 px for the
      // enclosure bezel, ending above the status bar on pages that show it
      if (id(batt_bar).state && !std::isnan(id(battery_level).state)) {
        int span = reterminal::bar_on_[reterminal::page] ? 442 : 476;
        int h = (int) (id(battery_level).state * span / 100.0f);
        if (h > 0)
          it.filled_rectangle(lang::rtl() ? 2 : 796, 2 + span - h, 2, h);
      }
