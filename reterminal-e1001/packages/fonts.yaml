# reTerminal — UI fonts for every supported language; the runtime
# Language select picks the active set through the font-role table
# (register_fonts in draw.h). Persian glyphs are generated by
# tools/gen_fa_strings.py; Vazirmatn is a single weight, so the
# Light/Medium/Bold roles collapse in that set.

# Explicit glyph set: the default covers ASCII only, we need the degree sign.
# Type roles: Light (300) for display numerals — thin strokes render crisply
# on the 1-bit panel and read calm at a distance; Medium (500) for labels;
# Bold (700) only inside inverted bands, where thin strokes fill in.
font:
  # tiny: graph axis/tick labels and analog captions
  - file: "gfonts://Inter@500"
    id: font_tiny
    size: 16
    glyphs: &glyphs '!"%()+,-./0123456789:;=?ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz °'
  - file: "gfonts://Inter@500"
    id: font_small
    size: 20
    glyphs: *glyphs
  - file: "gfonts://Inter@700"
    id: font_smallb
    size: 20
    glyphs: *glyphs
  - file: "gfonts://Inter@500"
    id: font_medium
    size: 32
    glyphs: *glyphs
  - file: "gfonts://Inter@300"
    id: font_large
    size: 48
    glyphs: *glyphs
  # digital world clock times
  - file: "gfonts://Inter@300"
    id: font_time
    size: 56
    glyphs: *glyphs
  # climate numerals; units ride the shoulder in font_small
  - file: "gfonts://Inter@300"
    id: font_huge
    size: 88
    glyphs: *glyphs

  # Persian set
  - file: "reterminal-e1001/vazirmatn.ttf"
    id: fa_tiny
    size: 16
    glyphs: &fa_glyphs !include ../fa_ui_glyphs.yaml
  - file: "reterminal-e1001/vazirmatn.ttf"
    id: fa_small
    size: 20
    glyphs: *fa_glyphs
  - file: "reterminal-e1001/vazirmatn.ttf"
    id: fa_smallb
    size: 20
    glyphs: *fa_glyphs
  - file: "reterminal-e1001/vazirmatn.ttf"
    id: fa_medium
    size: 32
    glyphs: *fa_glyphs
  - file: "reterminal-e1001/vazirmatn.ttf"
    id: fa_large
    size: 48
    glyphs: *fa_glyphs
  - file: "reterminal-e1001/vazirmatn.ttf"
    id: fa_time
    size: 56
    glyphs: *fa_glyphs
  - file: "reterminal-e1001/vazirmatn.ttf"
    id: fa_huge
    size: 88
    glyphs: *fa_glyphs
