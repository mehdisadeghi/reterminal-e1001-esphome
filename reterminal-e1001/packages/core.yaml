# reTerminal E1001 — core package: build inputs and boot orchestration
# (merged by packages: in the main yaml)

# The C++ behind the lambdas, as a component so a remote build can fetch
# it (reterminal.h is the umbrella the lambdas use)
external_components:
  - source: ${component_source}
    components: [reterminal]

# A unit's own dial photos go under dial_images in its config, e.g.
#   reterminal:
#     dial_images:
#       berlin: http://homeassistant.local:8123/local/dials/berlin.png
reterminal:

esphome:
  # Arduino bundled libs for the HA fetch + SD stack. Since 2026.7 the core
  # builds as an IDF component with selective compilation, and these names
  # switch the libraries on (core 3.x renamed WiFiClientSecure to
  # NetworkClientSecure; unknown names are looked up in the registry and
  # fail the build).
  libraries:
    - HTTPClient
    - Network
    - NetworkClientSecure
    - SPI
    - FS
    - SD
  on_boot:
    # 800 = before component setup, so a crash loop in a fresh firmware is
    # counted (and rolled back) no matter where it crashes
    - priority: 800
      then:
        - lambda: 'reterminal::rollback_check();'
    # -100 = everything is set up, so boot_flow may draw immediately
    - priority: -100
      then:
        # Power rails / 打开供电
        - output.turn_on: bsp_sd_enable
        - output.turn_on: bsp_battery_enable
        - output.turn_on: mic_power_enable
        - delay: 200ms
        - component.update: battery_voltage
        - component.update: battery_level
        # Read RTC time before anything needs the clock / 启动时读取 RTC 时间
        - lambda: 'reterminal::pre_rtc_time = ::time(nullptr);'
        - pcf8563.read_time:
        # Mount an already inserted card before the first draw can use its
        # dial-face overrides; the draw path itself never mounts
        - if:
            condition:
              binary_sensor.is_on: sd_card_detect
            then:
              - lambda: 'reterminal::sd_mount();'
        # Mirror all HA config entities, flag a dead RTC, restore the history
        # snapshot and apply the start page on cold boot
        - lambda: |-
            reterminal::register_fonts(0, id(font_tiny), id(font_small), id(font_smallb),
                                       id(font_medium), id(font_large), id(font_time),
                                       id(font_huge));
            reterminal::register_fonts(1, id(fa_tiny), id(fa_small), id(fa_smallb),
                                       id(fa_medium), id(fa_large), id(fa_time),
                                       id(fa_huge));
            reterminal::lang_apply(id(ui_lang).current_option().c_str());
            // HA reads the subscription list when it connects, which cannot
            // happen before setup ends
            auto *api = esphome::api::global_api_server;
            api->subscribe_home_assistant_state(
                reterminal::helper_id("input_button", "press"), {},
                [](StringRef s) { id(beep_request).publish_state(s.str()); });
            api->subscribe_home_assistant_state(
                reterminal::helper_id("input_text", "config"), {},
                [](StringRef s) { id(config_queue).publish_state(s.str()); });
            api->subscribe_home_assistant_state(
                reterminal::helper_id("input_boolean", "keep_awake"), {},
                [](StringRef s) { id(keep_awake).publish_state(s == "on"); });
            reterminal::radio_on = id(radio_sw).state;
            // A frozen chip (STOP set, dead cell) can report stale time as
            // valid and clobber the system clock that survives deep sleep on
            // its own — detect and undo that
            bool clobbered = reterminal::pre_rtc_time > reterminal::MIN_VALID_EPOCH &&
                             ::time(nullptr) < reterminal::pre_rtc_time - 300;
            if (clobbered) {
              struct timeval tv = {.tv_sec = reterminal::pre_rtc_time, .tv_usec = 0};
              settimeofday(&tv, nullptr);
              ESP_LOGW("reterminal", "RTC chip returned stale time; kept system clock");
            }
            reterminal::rtc_bad = clobbered ||
                                  ::time(nullptr) < reterminal::MIN_VALID_EPOCH;
            if (id(sync_interval).state >= 1)
              reterminal::sync_interval_min = (int) id(sync_interval).state;
            if (id(refresh_interval).state >= 1)
              reterminal::refresh_interval_min = (int) id(refresh_interval).state;
            if (id(night_refresh).state >= 0)
              reterminal::night_refresh_min = (int) id(night_refresh).state;
            if (id(combo_days).state >= 1)
              reterminal::week_days = (int) id(combo_days).state;
            if (id(night_from_n).state >= 0 && id(night_from_n).state <= 23)
              reterminal::night_from = (int) id(night_from_n).state;
            if (id(night_to_n).state >= 0 && id(night_to_n).state <= 23)
              reterminal::night_to = (int) id(night_to_n).state;
            bool *pe = reterminal::page_enabled_;
            pe[0] = id(show_page1).state;
            pe[1] = id(show_page2).state;
            pe[2] = id(show_page3).state;
            pe[3] = id(show_page4).state;
            pe[4] = id(show_page5).state;
            pe[5] = id(show_page6).state;
            pe[6] = id(show_page7).state;
            pe[7] = id(show_page8).state;
            pe[8] = id(show_page9).state;
            pe[9] = id(show_page10).state;
            reterminal::battery_check(id(battery_voltage).state);
            if (id(bar_font_size).state >= reterminal::BAR_FONT_MIN)
              reterminal::bar_font_px = (int) id(bar_font_size).state;
            reterminal::set_bar_skip(id(bar_skip).state.c_str());
            reterminal::rebuild_zones(
                id(zone1_en).state ? id(zone_1).state.c_str() : "",
                id(zone2_en).state ? id(zone_2).state.c_str() : "",
                id(zone3_en).state ? id(zone_3).state.c_str() : "",
                id(zone4_en).state ? id(zone_4).state.c_str() : "",
                id(zone5_en).state ? id(zone_5).state.c_str() : "",
                id(home_zone_t).state.c_str());
            reterminal::rebuild_columns(id(col_1).state.c_str(), id(col_2).state.c_str(),
                                        id(col_3).state.c_str());
            bool cold = esp_sleep_get_wakeup_cause() == ESP_SLEEP_WAKEUP_UNDEFINED;
            if (cold)
              reterminal::wifi_fail_wakes = 0;  // strikes end at a real reboot
            reterminal::hist_init(cold);
            if (cold) {
              int p = (int) id(start_page).state - 1;
              reterminal::page = (p >= 0 && p < reterminal::PAGE_COUNT) ? p : 0;
            }
            if (reterminal::page_hidden(reterminal::page))
              reterminal::next_page();
        - if:
            condition:
              lambda: 'return !reterminal::radio_on || reterminal::wifi_strikeout();'
            then:
              - wifi.disable:
        - lambda: 'reterminal::bump_awake();'
        - script.execute: boot_flow
        - script.execute: sd_check

