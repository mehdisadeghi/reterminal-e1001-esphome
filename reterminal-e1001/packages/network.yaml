# reTerminal E1001 — network package (merged by packages: in the main yaml)

text_sensor:
  # The three HA-queued helpers are named after the unit at runtime and
  # subscribed in on_boot (reterminal::helper_id); these entities only
  # carry the delivered state into the automations below.
  #
  # "Press" queue: input_button.<unit>_press. Its state is the timestamp of
  # its last press, so pressing it while the device sleeps is queued (any
  # number of presses collapse into the latest timestamp) and delivered on
  # the next wake — one beep signals "awake now, ready to interact".
  - platform: template
    id: beep_request
    on_value:
      then:
        - lambda: |-
            time_t ts = reterminal::parse_iso_utc(x.c_str());
            if (ts == 0)
              return;
            // after a reflash (ack lost) don't replay presses older than 15 min,
            // but a press queued during the last sleep must still beep
            if (reterminal::beep_ack == 0 && ts < ::time(nullptr) - 900) {
              reterminal::beep_ack = ts;
              return;
            }
            if (ts > reterminal::beep_ack) {
              reterminal::beep_ack = ts;
              ESP_LOGI("reterminal", "queued press received, beeping");
              id(beep_short).execute();
              reterminal::bump_interact();
            }

  # HA-queued config channel: input_text.<unit>_config. Write
  # semicolon-separated changes, e.g.
  #   zone3=Asia/Dubai;show7=off;night=19-7;col1=Device=dev
  # Keys: zone1..zone5 (spec or empty), col1..col3 (spec or empty), home,
  # night=F-T, start=N, sync=MIN, cycle/showN=on|off. Applied on wake (or
  # instantly while awake), then the helper is cleared as the
  # acknowledgement — requires "allow the device to perform Home Assistant
  # actions" in the ESPHome integration settings.
  - platform: template
    id: config_queue
    on_value:
      then:
        - if:
            condition:
              lambda: 'return !x.empty() && x != "unknown";'
            then:
              - lambda: 'reterminal::pending_changes = x;'
              - script.execute: apply_changes
              # Clear the helper: consumed exactly once, acts as the ack
              - homeassistant.action:
                  action: input_text.set_value
                  data:
                    entity_id: !lambda 'return reterminal::helper_id("input_text", "config");'
                    value: ""
              - script.execute: beep_short

time:
  # PCF8563 is at I2C address 0x51 with a CR1220 coin cell backup.
  # On boot we read the RTC; when HA syncs, we write back to the RTC.
  # PCF8563 在 I2C 地址 0x51，由 CR1220 纽扣电池备份。
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    update_interval: never

  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - pcf8563.write_time:
        # the chip was just written; if it is truly frozen, the next boot's
        # clobber detection re-raises the warning
        - lambda: 'reterminal::rtc_bad = false;'

# Home Assistant native API / Home Assistant 原生 API
api:
  encryption:
    key: !secret api_encryption_key
  # the helpers are subscribed from C++ (their ids exist only at runtime)
  homeassistant_states: true

# OTA (Over-The-Air) firmware update / 空中固件更新
ota:
  - platform: esphome
    password: !secret ota_password
    # Never fall asleep mid-update
    on_begin:
      then:
        - lambda: 'reterminal::ota_in_progress = true;'
    on_error:
      then:
        - lambda: |-
            reterminal::ota_in_progress = false;
            reterminal::bump_awake();
    # Network OTA gets the same self-rollback guard as SD updates: armed
    # here (still running the old image), confirmed by the next boot_flow
    on_end:
      then:
        - lambda: 'reterminal::rollback_arm();'

# Wi-Fi settings / Wi-Fi 设置
# No compiled-in credentials: the WLAN is provisioned at runtime with
# ESPHome's own machinery and persists in NVS across reboots and OTAs —
# via the fallback hotspot's captive portal, or over USB with Improv
# (the device builder's "Set up Wi-Fi credentials" menu).
wifi:
  # Open on purpose: it only appears while the unit has no working Wi-Fi,
  # and a password published with the firmware would protect nothing
  ap:
    ssid: "${ap_ssid}"

captive_portal:

improv_serial:
